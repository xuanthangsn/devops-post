services:
  db:
    image: mysql:8.0
    container_name: wp-local-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - blog_network

  wordpress:
    image: wordpress:latest
    container_name: wp-local-site
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wp_data:/var/www/html
    networks:
      - blog_network

  # One-shot: waits for `wordpress`, then installs WP core (if needed) and
  # installs + activates the git-it-write plugin. Exits once done; safe to
  # re-run (`docker compose up wpcli`) since every step is idempotent.
  wpcli:
    image: wordpress:cli
    container_name: wp-local-cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      HOME: /tmp
    # Match the uid:gid `wordpress:latest` (Debian) writes wp_data as, so this
    # Alpine-based cli image doesn't create root/mismatched-owner files there.
    user: "33:33"
    entrypoint: ["bash", "/wp-init.sh"]
    volumes:
      - wp_data:/var/www/html
      - ./wp-init.sh:/wp-init.sh:ro
    networks:
      - blog_network
    restart: "no"

volumes:
  db_data:
  wp_data:

networks:
  blog_network:
    driver: bridge
